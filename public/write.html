<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write a letter — Letters Left Unsent</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Gloock&family=Instrument+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="scene-page">
<svg id="scene" class="bg" viewBox="0 0 1440 720" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
<header class="nav">
  <a class="logo" href="index.html" aria-label="Letters Left Unsent, start of the story"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="3.2" fill="#e0a93b"/></svg></a>
  <span class="links" style="display:contents"><a href="write.html" aria-current="page">Write</a><a href="wall.html#wall" data-view="wall">The wall</a><a href="wall.html#mine" data-view="mine">My drawer</a></span>
  <span class="grow"></span>
  <span id="who" class="who" hidden></span>
  <a id="signin" class="pill soft" href="signin.html">Sign in</a>
  <button id="signout" class="pill soft" hidden>Sign out</button>
  <a class="pill dark" href="wall.html#wall">See the wall</a>
</header>
<main class="stage">
  <h1 class="wordmark small">Write a letter</h1>
  <div class="frame" style="margin-top:1.4rem;transform:rotate(-.4deg)">
    <form id="form" class="sheet write-card pt-6 pb-4">
      <span class="tape"></span>
      <div class="pl-16 pr-4 pb-2 hand text-2xl">
        Dear <input id="recipient" maxlength="60" placeholder="someone…" class="hand bg-transparent border-b border-dashed border-[#2f153399] w-48 focus:outline-none">,
      </div>
      <textarea id="content" class="letter-body" maxlength="3000" required placeholder="Say the thing you never said…"></textarea>
      <div class="flex justify-end px-5 pb-3 text-xs" style="color:#2f1533aa"><span id="count">0</span>/3000</div>
      <div class="write-foot">
        <label>Time capsule: open on
          <input id="schedule" type="date" class="field">
          <span class="hint2">Leave empty to pin it today.</span>
        </label>
        <div class="flex items-center"><button id="send" class="btn solid" type="submit">Pin it to the wall</button><span id="status" class="status" role="status"></span></div>
      </div>
    </form>
  </div>
</main>
<nav class="dock" aria-label="Sections"><a class="tab" href="write.html" aria-current="page"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M11.5 1.5l3 3L5 14l-4 1 1-4z"/></svg>Write</a><a class="tab" href="wall.html#wall" data-view="wall"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z"/></svg>The wall</a><a class="tab" href="wall.html#mine" data-view="mine"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 3h12v4H2zM3 8h10v5H3zM6.5 9.5h3v1.5h-3z"/></svg>My drawer</a></nav>
<dialog id="gentle" aria-labelledby="gt">
  <div class="frame"><div class="sheet p-7 pl-16">
    <p id="gt" class="hand text-2xl" style="line-height:34px">This space is for healing and hope. We noticed some negative themes in your draft. Want to try focusing on a positive memory instead?</p>
    <div class="mt-5 flex gap-3 flex-wrap">
      <button id="gentle-ok" class="btn solid" type="button">Yes, a warmer memory</button>
      <button id="gentle-close" class="btn" type="button">Let me re-read</button>
    </div>
  </div></div>
</dialog>
<script src="js/scene.js"></script>
<script src="js/common.js"></script>
<script src="js/write.js"></script>
<script src="js/music.js"></script>
</body></html>
